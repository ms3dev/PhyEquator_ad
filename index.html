<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Phytype Equation Editor</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-user-select: none; /* Safari */
            -ms-user-select: none;     /* IE 10+ and Edge */
            user-select: none;         /* Standard syntax */
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #ffffff;
        }

        .banner {

            width: 300px;
            height: 100px;

            position: relative;
            overflow: hidden;

            border-radius: 6px;

            background: linear-gradient(135deg, #04152f, #0b3d91, #118dff);
            /*background: linear-gradient(135deg, #0f0c20, #1d1744, #392b84);*/

            /*box-shadow: 0 0 25px rgba(0,140,255,.45);*/

            font-family: Segoe UI, Arial, sans-serif;

        }

        /*** Glow ***/

        .banner::before {

            content: "";

            position: absolute;

            width: 180px;
            height: 180px;

            left: -70px;
            top: -40px;

            border-radius: 50%;

            background: rgba(255, 255, 255, .18);

            filter: blur(35px);

            animation: moveGlow 6s ease-in-out infinite alternate;

        }

        /*** Equations ***/

        .equations {

            position: absolute;

            top: 10px;
            left: 150px;

            font-size: 18px;

            color: rgba(255, 255, 255, .10);

            transform: rotate(-10deg);

            white-space: nowrap;

            animation: scrollEquation 15s linear infinite;

        }

        /*** Logo ***/

        .logo {

            position: absolute;

            left: 12px;
            top: 14px;

            width: 72px;
            height: 72px;

            border-radius: 4px;


            object-fit: contain;

            filter: drop-shadow(0 0 8px #5fd2ff);

            animation: floatLogo 3s ease-in-out infinite;


        }

        /*** Shine ***/

        .shine {

            position: absolute;

            left: -80px;
            top: 0;

            width: 40px;
            height: 100%;

            transform: skewX(-25deg);

            background: rgba(255, 255, 255, .45);

            filter: blur(8px);

            animation: shine 5s infinite;

        }

        /*** Text ***/

        .title {

            position: absolute;

            left: 96px;
            top: 0px;

            font-size: 28px;

            font-weight: bold;

            color: white;

            text-shadow:
                0 0 8px #00d0ff,
                0 0 18px #0095ff;

            animation: titleGlow 2s infinite alternate;

        }

        .subtitle {

            position: absolute;

            left: 97px;
            top: 55px;

            color: #d6eeff;

            font-size: 13px;

            letter-spacing: 2px;

        }

        .arabic {
            position: absolute;
            left: 97px;
            top: 40px;
            color: #ffffff;
            font-size: 14px;
            font-weight: 600;
            bottom: 10px;
            /* letter-spacing:5px; */
            text-shadow: 0 0 8px rgba(0, 220, 255, .8);
            animation: fadeText 3s ease-in-out infinite;
        }

        .line {

            position: absolute;

            left: 97px;
            bottom: 15px;

            width: 170px;
            height: 2px;

            background:
                linear-gradient(90deg, #00d5ff, #ffffff, #00d5ff);

            animation: lineGlow 2s infinite;

        }



        /*** Animations ***/

        @keyframes fadeText {
            0% {
                opacity: .7;
            }

            50% {
                opacity: 1;

            }

            100% {
                opacity: .7;
            }

        }


        @keyframes floatLogo {

            0%,
            100% {

                transform: translateY(0);

            }

            50% {

                transform: translateY(-5px);

            }

        }

        @keyframes moveGlow {

            from {

                transform: translateX(0);

            }

            to {

                transform: translateX(150px);

            }

        }

        @keyframes shine {

            0% {

                left: -80px;

            }

            100% {

                left: 350px;

            }

        }

        @keyframes titleGlow {

            from {

                text-shadow:
                    0 0 8px #00bfff;

            }

            to {

                text-shadow:
                    0 0 14px #00ffff,
                    0 0 28px #00aaff;

            }

        }

        @keyframes scrollEquation {

            0% {

                transform: translateX(0) rotate(-10deg);

            }

            100% {

                transform: translateX(-500px) rotate(-10deg);

            }

        }

        @keyframes lineGlow {

            0% {

                opacity: .4;

            }

            50% {

                opacity: 1;

            }

            100% {

                opacity: .4;

            }

        }
    </style>

</head>

<body>

    <div class="banner">

        <div class="shine"></div>

        <div class="title">
            Phytype
        </div>

        <div class="subtitle">
            Equation Editor V1.5
        </div>

        <div class="line"></div>

        <div class="equations">

            F = ma &nbsp;&nbsp;
            E = mc² &nbsp;&nbsp;
            ∫x²dx &nbsp;&nbsp;
            H₂ + O₂ → H₂O &nbsp;&nbsp;
            ΣF = 0

        </div>
        <div class="arabic">محرر المعادلات</div>

        <img src="logo.jpg" class="logo">
    </div>

    

</body>

</html>
